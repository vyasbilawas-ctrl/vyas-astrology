<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autonomous App</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; text-align: center; }
    .card { background: #1e293b; border-radius: 12px; padding: 30px; max-width: 650px; margin: 40px auto; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { color: #38bdf8; margin-bottom: 8px; }
    .badge { display: inline-block; background: #0284c7; color: white; padding: 4px 12px; border-radius: 9999px; font-size: 13px; font-weight: bold; margin-bottom: 15px; }
    p { color: #94a3b8; line-height: 1.6; }
    button { background: #38bdf8; color: #0f172a; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-top: 15px; }
    button:hover { background: #7dd3fc; }
    #output { margin-top: 20px; font-weight: bold; color: #4ade80; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Zero Disk AI App</div>
    <h1>⚡ Autonomous Software</h1>
    <p>Aapke instruction ke anusaar CLI aur Filesystem par autonomously software generate ho gaya hai.</p>
    <button onclick="document.getElementById('output').innerText = 'Verified at ' + new Date().toLocaleTimeString()">Verify Interactivity</button>
    <div id="output"></div>
  </div>
</body>
</html>
